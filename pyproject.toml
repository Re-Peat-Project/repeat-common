[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repeat-common"
version = "0.0.1"
description = "Shared code of the RE-PEAT modules: grid helpers, open-data readers, SiTMAT water-table reader, config helpers"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "rasterio>=1.3", "geopandas>=0.14", "shapely>=2.0",
    "pyproj>=3.5", "pyyaml>=6.0",
    # cloud-native access (sources.py, forcing.py)
    "pystac-client>=0.7", "planetary-computer>=1.0", "odc-stac>=0.3.9", "xarray>=2024.1", "dask>=2024.1",
    "zarr>=2.16", "adlfs>=2024.1", "fsspec>=2024.1",
    # data fetchers (fetch_firms.py, fetch_peat_extent.py)
    "pyogrio>=0.7", "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]
